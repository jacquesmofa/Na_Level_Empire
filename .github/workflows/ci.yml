# Checks every pull request: install exact versions, lint, type-check, build.
# Nothing is deployed from here: Vercel builds and deploys on its own
# (a preview for every pull request, production when main changes).
name: CI

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install exact dependency versions
        run: npm ci

      - name: Lint and type-check
        run: npm run check

      - name: Build
        run: npm run build

      - name: Upload the built site (for review)
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7
